name: Import Developer ID certificate
description: Loads the Developer ID Application certificate into a temporary keychain and exports SIGN_IDENTITY.
inputs:
  certificate:
    description: Base64-encoded .p12 of the Developer ID Application certificate
    required: true
  password:
    description: Password of the .p12
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        CERTIFICATE: ${{ inputs.certificate }}
        CERTIFICATE_PASSWORD: ${{ inputs.password }}
      run: |
        set -euo pipefail
        keychain="$RUNNER_TEMP/signing.keychain-db"
        keychain_password="$(uuidgen)"
        security create-keychain -p "$keychain_password" "$keychain"
        security set-keychain-settings -lut 21600 "$keychain"
        security unlock-keychain -p "$keychain_password" "$keychain"
        echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
        security import "$RUNNER_TEMP/cert.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
        rm "$RUNNER_TEMP/cert.p12"
        security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
        security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
        identity="$(security find-identity -v -p codesigning "$keychain" | grep 'Developer ID Application' | head -1 | awk -F'"' '{print $2}')"
        if [ -z "$identity" ]; then
          echo "::error::No 'Developer ID Application' identity found in MACOS_CERTIFICATE"
          exit 1
        fi
        echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
